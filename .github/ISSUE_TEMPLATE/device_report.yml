name: Device report
description: Tell us how openExpress works with your Garmin device (also when everything works!)
title: "[Device] "
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing openExpress! Reports for devices that are not yet in the
        [list of supported devices](https://github.com/TomaszBojanowski/openExpress/blob/main/docs/devices.md)
        are the most valuable help right now – **also when everything works**.

        **Privacy:** don't paste `openexpress info` output, your `GarminDevice.xml` or files
        from `~/.config/openexpress` – they contain your device's serial number, unit ID,
        map unlock codes or login token. The report below contains none of these, and the
        log is already filtered.
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: |
        In the window: main menu (☰) → **Report a Device or Problem…** → **Copy**.
        Or in a terminal: `openexpress report`
        (Flatpak: `flatpak run io.github.tomaszbojanowski.OpenExpress report`).
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What did you try, and what worked?
      description: Tick only what you tried and it worked. Anything that failed goes in the field below.
      options:
        - label: The device was detected
        - label: Sync with Garmin Connect (activities, courses, workouts)
        - label: Software updates (firmware and other components)
        - label: Maps (Garmin maps or your own .img)
        - label: Connect IQ apps or watch faces
        - label: Music, podcasts or audiobooks
  - type: textarea
    id: failed
    attributes:
      label: What didn't work?
      placeholder: What you did and any error you saw
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the output of report --log here if something didn't work.
      render: shell
    validations:
      required: false
