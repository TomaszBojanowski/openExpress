name: Device report
description: Tell us how openExpress works with your Garmin device (also when everything works!)
title: "[Device] "
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing openExpress! Reports for devices that are not yet in the README are
        the most valuable help right now – **also when everything works**.

        **Privacy:** don't paste `openexpress info` output, your `GarminDevice.xml` or files
        from `~/.config/openexpress` – they contain your device's serial number, unit ID,
        map unlock codes or login token. The report below contains none of these, and the
        log at its end is already filtered.
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: |
        In the window: main menu (☰) → **Report a Device or Problem…** → Copy.
        Or in a terminal: `openexpress report`
        (Flatpak: `flatpak run io.github.tomaszbojanowski.OpenExpress report`).
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What did you try, and what worked?
      description: Tick only what you tried and that worked; describe problems below.
      options:
        - label: The device is detected and the Device page shows it
        - label: Logging in to Garmin Connect
        - label: Sync – a new activity appeared in Garmin Connect
        - label: Sync – a course or workout from Garmin Connect arrived on the device
        - label: Checking for software updates
        - label: Installing a system software update (GUPDATE file; the device installs it after it is disconnected)
        - label: Installing other software components (e.g. time zone map, sensor or map support files)
        - label: Installing, updating or removing a Garmin map
        - label: Adding or removing a map of your own (.img)
        - label: Installing or removing a Connect IQ app or watch face
        - label: Copying music, podcasts or audiobooks
        - label: Making a backup
        - label: Background sync when the device is connected
  - type: dropdown
    id: beta
    attributes:
      label: Is the device in Garmin's beta program?
      options:
        - "Yes"
        - "No"
        - Don't know
    validations:
      required: false
  - type: textarea
    id: problems
    attributes:
      label: What did not work? Error messages
      description: |
        What you did, what you expected and what happened, with the exact error message.
        For details run the command with `-v`, e.g. `openexpress -v sync`.

        **Before pasting:** the log at the end of the device report is already filtered.
        Anything else you paste (output of `-v`, `journalctl`, screenshots) is not: remove the
        serial number (it is also part of `mtp://…` addresses), the unit ID, your e-mail
        address and the names of your files first.
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: How did you install openExpress?
      options:
        - Flatpak bundle from GitHub releases
        - pip / wheel
        - From source (git clone)
    validations:
      required: true
