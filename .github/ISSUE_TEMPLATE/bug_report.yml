name: Bug report
description: Something doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** never paste `openexpress info` output, `GarminDevice.xml`, files from
        `~/.config/openexpress` or your e-mail address – use the device report instead.
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: |
        In the window: main menu (☰) → **Report a Device or Problem…** → **Copy**.
        Or in a terminal: `openexpress report`
        (Flatpak: `flatpak run io.github.tomaszbojanowski.OpenExpress report`).
        No device detected? Write the openExpress version (About openExpress) and your system instead.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What you did, what you expected and any error you saw
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the output of report --log here if something didn't work.
      render: shell
    validations:
      required: false
