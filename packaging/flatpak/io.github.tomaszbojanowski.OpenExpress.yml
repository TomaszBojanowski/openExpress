app-id: io.github.tomaszbojanowski.OpenExpress
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: openexpress
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The USB device nodes (/dev/bus/usb) and nothing else of /dev: some watches (e.g. the
  # fēnix 8) hide their app folder from MTP, and Connect IQ apps are written there over a
  # direct USB connection (PTP). Without it (or with a Flatpak older than 1.16, which
  # ignores it) such apps are only queued in Garmin Connect. Never --device=all.
  - --device=usb
  # The watch is mounted by the host's gvfs (MTP); talk to it over D-Bus.
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  # Devices in mass storage mode (e.g. the Varia RTL515) are drives the system mounts under
  # /run/media (or /media on some distributions): read and written there.
  - --filesystem=/run/media
  - --filesystem=/media
  # gvfs refuses to copy local files for sandboxed apps and gvfs-mtp offers no other way
  # to write to the watch, so files are copied with the host's `gio copy` via flatpak-spawn.
  - --talk-name=org.freedesktop.Flatpak
  # Command-line convenience: the installer in Downloads, music in Music,
  # backups in Documents/Garmin. The window uses portals for everything else.
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-documents/Garmin:create

cleanup:
  - /include
  - /lib/pkgconfig
  - "*.a"

modules:
  - name: 7zip
    buildsystem: simple
    build-commands:
      - make -C CPP/7zip/Bundles/Alone2 -f makefile.gcc -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 CPP/7zip/Bundles/Alone2/_o/7zz ${FLATPAK_DEST}/bin/7zz
      - install -Dm644 DOC/License.txt ${FLATPAK_DEST}/share/licenses/7zip/License.txt
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/26.04/7z2604-src.tar.xz
        sha256: 9691944c0fe0d01bb49373a704fb983fd33bc98b1738695179dfbf99ac1734f6
        strip-components: 0

  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --find-links=. --prefix=${FLATPAK_DEST}
        requests urllib3 idna certifi charset-normalizer mutagen
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl
        sha256: 62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
      - type: file
        url: https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl
        sha256: b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
      - type: file
        url: https://files.pythonhosted.org/packages/47/d8/a29e4e3991765e7ce4ed1f7e4074fe1ba9da03e0048639734de60f9cadb9/mutagen-1.48.1-py3-none-any.whl
        sha256: 4f077fe87d3fc7fba259aa63d8c026b18382ca6a42ef37c61e16f1b1b5b82fe7

  - name: openexpress
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - python3 -c "from openexpress.desktop import desktop_entry; print(desktop_entry('openexpress gui'), end='')"
        > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 openexpress/data/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-watch-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-watch-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-cycling-computer-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-cycling-computer-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-bike-accessory-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-bike-accessory-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-handheld-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-handheld-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-device-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-device-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-heart-rate-monitor-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-heart-rate-monitor-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-scale-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-scale-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-blood-pressure-monitor-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-blood-pressure-monitor-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-bike-sensor-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-bike-sensor-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}-view-auto-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-view-auto-symbolic.svg
      - install -Dm644 openexpress/data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # Local builds use the working tree; release builds should pin a git tag instead.
      - type: dir
        path: ../..
        skip:
          - _extracted
          - testdata
          - build
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - docs/analiza
          - docs/ANALIZA.md
