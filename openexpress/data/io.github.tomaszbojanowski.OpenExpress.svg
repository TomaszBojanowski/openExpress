<g stroke="#bdc6cf" stroke-width="1.5" stroke-linecap="round" opacity=".35">
<path d="m45 40 2 2m34-2-2 2M45 78l2-2m34 2-2-2"/>
</g>
<g transform="translate(64 59) scale(.79)" fill="#f6f5f4">
