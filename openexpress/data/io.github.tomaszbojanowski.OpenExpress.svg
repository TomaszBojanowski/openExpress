<rect x="19" y="56" width="6" height="8" rx="2" fill="url(#buttons)"/>
<rect x="25" y="78" width="6" height="7" rx="2" fill="url(#buttons)" transform="rotate(-30 28 81)"/>
<rect x="97" y="35" width="7" height="7" rx="2" fill="url(#buttons)" transform="rotate(-30 100 38)"/>
