<path d="M102 49h3q4 0 4 4v10q0 4-4 4h-3Z" fill="url(#guard)"/>
<path d="M106 55v6" stroke="#be5428" stroke-width="1.5" stroke-linecap="round"/>
<!-- Raised metal bezel and visible case depth. -->
<circle cx="64" cy="64" r="41" fill="#20252d"/>
<circle cx="64" cy="62" r="41" fill="url(#side)"/>
<circle cx="64" cy="59" r="41" fill="url(#bezel)"/>
<circle cx="64" cy="59" r="38" fill="none" stroke="#c6cbd1" stroke-opacity=".23" stroke-width="1"/>
<circle cx="64" cy="59" r="33" fill="#171e25"/>
<!-- Restrained warm ring, recessed dial, readable sync symbol. -->
<circle cx="64" cy="59" r="30" fill="#b98d61"/>
<circle cx="64" cy="59" r="28" fill="url(#glass)"/>
