<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><defs><linearGradient id="strap" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff965b"/><stop offset="1" stop-color="#ed6133"/></linearGradient><linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#727983"/><stop offset="1" stop-color="#363b44"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4c515b"/><stop offset="1" stop-color="#242930"/></linearGradient><linearGradient id="guard" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffa96b"/><stop offset="1" stop-color="#ed743d"/></linearGradient><linearGradient id="buttons" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ba1aa"/><stop offset="1" stop-color="#484e58"/></linearGradient><radialGradient id="glass" cx=".35" cy=".25" r=".85"><stop stop-color="#294754"/><stop offset="1" stop-color="#12212c"/></radialGradient></defs><g transform="rotate(-16 64 63)">
