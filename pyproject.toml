[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openexpress"
version = "0.5.1"
description = "Unofficial Linux app for Garmin watches: Garmin Connect sync, software updates, maps, Connect IQ apps and music"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tomasz Bojanowski" }]
keywords = ["garmin", "fenix", "linux", "sync", "mtp", "gtk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Polish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/TomaszBojanowski/openExpress"
Issues = "https://github.com/TomaszBojanowski/openExpress/issues"

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
music = ["mutagen>=1.45"]
test = ["pytest>=7"]

[project.scripts]
openexpress = "openexpress.cli:main"

[tool.setuptools.packages.find]
include = ["openexpress*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Not our code: PyGObject 3.56 warns on its own while loading the GLib overrides, at
    # `from gi.repository import GLib`. Only this one message is silenced.
    "ignore:GLib\\.unix_signal_add_full is deprecated:gi.PyGIDeprecationWarning",
]

[tool.setuptools.package-data]
openexpress = ["locale/*/LC_MESSAGES/*.mo", "data/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_extracted", "docs/analiza", "testdata"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # syntax, names, style; E also gives the "noqa: E402" comments a meaning
    "I",             # import order
    "UP",            # syntax of the oldest supported Python (3.11)
    "B", "SIM", "PIE", "RET", "FURB",  # common mistakes and simplifications
    "ISC",           # strings concatenated by accident
    "BLE",           # broad "except Exception": each one carries a noqa with its reason
    "PLW1510",       # subprocess.run says whether a failure raises
    "S110",          # silent "except: pass"
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # "×" in log lines, deliberate Unicode in tests
    "RUF005", "SIM105",            # matters of taste
    "B905",                        # zip(strict=True) would change behaviour
]

[tool.ruff.lint.per-file-ignores]
# Expected messages are long; fixtures are imported and unpacked without using every part;
# fakes keep their state in class attributes.
"tests/*" = ["E501", "F811", "RUF059", "RUF012", "RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["openexpress"]
